<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Northline Logistics LLC — Workspace Benchmark</title><style>
:root{--bg:#f4f6f9;--panel:#fff;--ink:#1c2330;--muted:#6b7280;--line:#e6e9ef;--accent:#2f5bd6;
--navy:#243a6b;--chip:#eef2fb;--green:#1f9d55;--amber:#c9820a;--red:#c62828;--code:#f4f6fb}
html[data-theme=dark]{--bg:#0e1420;--panel:#161d2c;--ink:#e6ebf3;--muted:#93a0b4;--line:#26314a;
--accent:#6ea0ff;--navy:#9db6ef;--chip:#1b2740;--code:#111827}
*{box-sizing:border-box}body{margin:0;font:15px/1.6 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
header.top{background:linear-gradient(135deg,#243a6b,#16244a);color:#fff;padding:22px 28px}
header.top h1{margin:0;font-size:22px;letter-spacing:.2px}header.top p{margin:4px 0 0;color:#cdd8ee;font-size:13px}
.tabs{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:4px;padding:0 20px;flex-wrap:wrap;align-items:center}
.tab{background:none;border:none;padding:14px 16px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tgl{margin-left:auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}
.wrap{max-width:1160px;margin:0 auto;padding:24px 28px}
.view.hidden{display:none}
h2{font-size:20px;margin:26px 0 10px}h3{font-size:15px;margin:16px 0 8px}
.lede{color:var(--muted);font-size:14.5px;max-width:840px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
.kpi{background:linear-gradient(135deg,var(--panel),var(--chip));border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .n{font-size:24px;font-weight:800;color:var(--navy)}.kpi .l{font-size:12px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px 20px;margin-bottom:16px}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.g2,.g3{grid-template-columns:1fr}}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--chip);font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--chip);color:var(--navy);margin:0 5px 5px 0}
.badge{display:inline-block;padding:1px 9px;border-radius:999px;font-size:11px;font-weight:800}
.b-easy{background:rgba(31,157,85,.15);color:var(--green)}.b-med{background:rgba(201,130,10,.16);color:var(--amber)}.b-hard{background:rgba(198,40,40,.14);color:var(--red)}
.navcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer}
.pcard:hover{border-color:var(--accent)}.pcard.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(47,91,214,.15)}
.av{width:40px;height:40px;border-radius:50%;background:var(--chip);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800}
.muted{color:var(--muted)}.small{font-size:12px}.mono{font-family:ui-monospace,Menlo,monospace}
.donutwrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.leg .legrow{font-size:12.5px;margin:2px 0}.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
details{border:1px solid var(--line);border-radius:9px;padding:8px 12px;margin:8px 0;background:var(--panel)}details>summary{cursor:pointer;font-weight:600}
.explorer input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:var(--bg);color:var(--ink);margin-bottom:10px}
.filerow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.filerow .ic{width:26px;text-align:center}.filerow .ty{margin-left:auto;font-size:11px;color:var(--muted)}
.filelink{cursor:pointer;border-bottom:1px dotted var(--accent)}
.raw{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.subtab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.subtab.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.trigger{background:var(--chip);border-radius:10px;padding:12px 14px;font-size:13.5px}
.gp{list-style:none;padding:0;margin:8px 0}.gp li{padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin:6px 0;background:var(--panel)}
.gp .m{font-size:10px;color:#fff;background:var(--navy);border-radius:5px;padding:1px 6px;margin-right:6px}
.fm li{margin:4px 0}.verif{list-style:none;padding:0}.verif li{padding:7px 0;border-bottom:1px solid var(--line)}
.verif .ck{color:var(--green);font-weight:800;margin-right:7px}.verif .vp{color:var(--muted);font-size:12px;margin-left:24px}
.sell{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.sell .card h3{margin-top:0}
blockquote{border-left:3px solid var(--accent);margin:10px 0;padding:6px 14px;color:var(--muted);background:var(--chip);border-radius:0 8px 8px 0}
/* file viewer modal */
.fv-ov{position:fixed;inset:0;background:rgba(15,22,40,.55);display:none;align-items:center;justify-content:center;z-index:1000}
.fv-ov.open{display:flex}
.fv{background:var(--panel);width:min(940px,94vw);max-height:88vh;border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.fv-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--chip)}
.fv-h .fn{font-weight:700;font-size:14px;word-break:break-all}
.fv-b{padding:16px;overflow:auto}.fv-b pre{white-space:pre-wrap;word-break:break-word;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:12px;font:12.5px/1.55 ui-monospace,Menlo,monospace}
.fv-b table{font-size:12.5px}.fv-b th,.fv-b td{border:1px solid var(--line)}
.fv-b img{max-width:100%;border:1px solid var(--line);border-radius:8px}.fv-b iframe{width:100%;height:64vh;border:1px solid var(--line);border-radius:8px}
.fv-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;text-decoration:none}
.jk{color:#7c3aed}.js{color:#166534}.jn{color:#b45309}.jb{color:#0369a1}
.note{background:#fff8e6;border:1px solid #f0e0b0;border-radius:8px;padding:12px;color:#7a5b00}
/* hover-definition tooltips */
.tip{position:relative;cursor:help;border-bottom:1px dotted currentColor}
.tip .tipbox{visibility:hidden;opacity:0;transition:opacity .12s;position:absolute;left:0;bottom:150%;z-index:90;
  background:#0f172a;color:#f8fafc;padding:9px 11px;border-radius:8px;font:400 12px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;
  width:min(300px,72vw);box-shadow:0 12px 32px rgba(0,0,0,.4);text-transform:none;letter-spacing:normal}
.tip:hover .tipbox,.tip:focus .tipbox{visibility:visible;opacity:1}
.vtag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.02em;padding:2px 7px;border-radius:6px;margin-right:8px;border-bottom:none;vertical-align:1px}
.vtag.tip{border-bottom:none}
.vc-EXTRACT{background:rgba(31,157,85,.16);color:var(--green)}
.vc-LOGIC{background:rgba(47,91,214,.15);color:var(--accent)}
.vc-MODAL{background:rgba(201,130,10,.18);color:var(--amber)}
.vc-NEG{background:rgba(198,40,40,.15);color:var(--red)}
.vc-FILE{background:rgba(124,58,237,.15);color:#7c3aed}
.verif li{padding:10px 0;border-bottom:1px solid var(--line)}
.verif .ck{color:var(--green);font-weight:800;margin-right:7px}
.verif .vp{color:var(--ink);font-size:12.5px;margin:5px 0 0 24px}

scan.", "class": "V-MODAL"}, {"statement": "Sources Sterling's exit from the loss review/OTD history.", "pass": "Cites Sterling loss review.", "class": "V-FILE"}]}, {"id": "FPN-03", "persona": "FP&A Analyst", "difficulty": "Hard", "hops": 8, "trigger": {"type": "Finance reconciliation request (Slack DM)", "from": "Henry Caldwell (Controller)", "to": "Aisha Bello", "timestamp": "2026-02-11 08:45", "message": "Aisha — someone re-shared an older board pack and now there's confusion: the draft and final disagree on churn and FY2025 revenue. I need you to state which is correct and why, and quantify the AR reconciliation gap that explains the difference. This is going to the audit file."}, "prompt": "Determine which FY2025 board pack (draft vs final) is correct and why, and quantify the AR reconciliation gap that explains the difference between them.", "golden_path": [{"file": "workspace/Finance/board/FY2025_board_pack_DRAFT.pdf", "flat": "workspace__Finance__board__FY2025_board_pack_DRAFT.pdf", "name": "FY2025_board_pack_DRAFT.pdf", "modality": "PDF", "action": "Read the DRAFT: churn -$0.98M, FY2025 $18.58M (preliminary)."}, {"file": "workspace/Finance/board/FY2025_board_pack_final.pdf", "flat": "workspace__Finance__board__FY2025_board_pack_final.pdf", "name": "FY2025_board_pack_final.pdf", "modality": "PDF", "action": "Read the FINAL: churn -$1.14M, FY2025 $18.42M (board-approved)."}, {"file": "workspace/Finance/revenue/revenue_bridge_FY2025.xlsx", "flat": "workspace__Finance__revenue__revenue_bridge_FY2025.xlsx", "name": "revenue_bridge_FY2025.xlsx", "modality": "XLSX", "action": "Confirm the bridge ties to the FINAL (-$1.14M / $18.42M)."}, {"file": "workspace/Finance/invoicing/AR_aging_2026-03.xlsx", "flat": "workspace__Finance__invoicing__AR_aging_2026-03.xlsx", "name": "AR_aging_2026-03.xlsx", "modality": "XLSX", "action": "Read AR aging: Meridian $128,400 at >90 days, disputed."}, {"file": "workspace/Clients/Meridian_Apparel/_archive/meridian_final_invoices.csv", function chips(a){return a.map(x=>`<span class="pill">${esc(x)}</span>`).join('');}
function ul(a){return '<ul>'+a.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';}
// hover-definition glossary
const GLOSS={
 trigger:"The real workplace event that starts the task — a Slack message, a forwarded email, or a request from a manager or executive. It explains WHY the work is happening.",
 golden:"The ideal, ordered set of sources an expert would open to answer the task. Each step is one distinct document, conversation, or image — the reasoning trail a good answer follows.",
 sources:"The number of distinct sources the ideal answer draws on. Difficulty is set by this count: Easy = 4, Medium = 6, Hard = 8.",
 failure:"Common ways an answer can go wrong here — plausible but incorrect shortcuts, outdated documents, or claims taken at face value.",
 ground:"The correct expert answer to the task, with the reasoning and evidence behind it.",
 verifiers:"The individual pass/fail checks used to grade an answer. On each line, the bold text is WHAT is being checked; ‘Passes if’ is the exact condition that must be true. The colored tag says WHICH KIND of check it is — hover it for the definition."
};
const VC={
 "V-EXTRACT":["Extraction","Did the answer pull the correct value or fact out of a source?"],
 "V-LOGIC":["Reasoning","Did the answer do the right calculation or logical step (not just find data)?"],
 "V-MODAL":["Multimodal","Did the answer correctly read a non-text source — an image, chart, scan, or handwritten note?"],
 "V-NEG":["Negative / trap","Did the answer correctly AVOID a trap — an outdated, superseded, or unreliable source it should not use?"],
 "V-FILE":["Sourcing","Did the answer rely on the correct file rather than an unrelated one?"]
};
function tip(label,def){return `<span class="tip" tabindex="0">${label}<span class="tipbox">${esc(def)}</span></span>`;}
function vtag(cls){const cs=cls.replace('V-',''),d=VC[cls]||['',''];
 return `<span class="vtag vc-${cs} tip" tabindex="0">${cls}<span class="tipbox"><b>${esc(d[0])} check.</b> ${esc(d[1])}</span></span>`;}
function show(v){document.querySelectorAll('.view').forEach(x=>x.classList.add('hidden'));
 document.getElementById('view-'+v).classList.remove('hidden');
 document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.v===v));
 history.replaceState(null,'','#'+v);window.scrollTo(0,0);}
function toggleTheme(){const h=document.documentElement,n=h.getAttribute('data-theme')==='dark'?'light':'dark';h.setAttribute('data-theme',n);localStorage.setItem('nl-theme',n);document.getElementById('tgl').textContent=n==='dark'?'☀ Light':'☾ Dark';}

const FICON={pdf:'📕',xlsx:'📊',csv:'📈',docx:'📄',md:'📝',txt:'📃',json:'🧩',png:'🖼️'};

 DATA.areas.forEach(a=>{const fs=a.files.filter(f=>!q||(f.name+' '+a.name).toLowerCase().includes(q));if(!fs.length)return;

/* ---------- file viewer ---------- */
function extOf(p){return (p.split('.').pop()||'').toLowerCase();}
function mdToHtml(src){const L=src.split('\n');let o=[],ul=false,tb=false;
 const il=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
 for(let ln of L){if(/^\|(.+)\|\s*$/.test(ln)){const c=ln.trim().replace(/^\||\|$/g,'').split('|').map(x=>x.trim());if(c.join('').replace(/[-: ]/g,'')===''){continue;}if(!tb){o.push('<table>');tb=true;}o.push('<tr>'+c.map(x=>'<td>'+il(x)+'</td>').join('')+'</tr>');continue;}else if(tb){o.push('</table>');tb=false;}
  if(/^### /.test(ln))o.push('<h3>'+il(ln.slice(4))+'</h3>');else if(/^## /.test(ln))o.push('<h3>'+il(ln.slice(3))+'</h3>');else if(/^# /.test(ln))o.push('<h3>'+il(ln.slice(2))+'</h3>');
  else if(/^[-*] /.test(ln)){if(!ul){o.push('<ul>');ul=true;}o.push('<li>'+il(ln.slice(2))+'</li>');}else{if(ul){o.push('</ul>');ul=false;}if(ln.trim())o.push('<p>'+il(ln)+'</p>');}}
 if(ul)o.push('</ul>');if(tb)o.push('</table>');return o.join('');}
function jsonHi(o){let s=esc(JSON.stringify(o,null,2));
 s=s.replace(/("(?:\\.|[^"\\])*")(\s*:)/g,'<span class="jk">$1</span>$2').replace(/:\s("(?:\\.|[^"\\])*")/g,': <span class="js">$1</span>').replace(/([:\[,]\s*)(-?\d+\.?\d*)/g,'$1<span class="jn">$2</span>').replace(/([:\[,]\s*)(true|false|null)/g,'$1<span class="jb">$2</span>');return '<pre>'+s+'</pre>';}
function csvTable(t){const rows=[];let i=0,f='',row=[],q=false;while(i<t.length){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else{if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}else f+=c;}i++;}if(f.length||row.length){row.push(f);rows.push(row);}const nz=rows.filter(r=>r.some(x=>x.trim()!==''));if(!nz.length)return '<pre></pre>';return '<div style="overflow:auto"><table><tr>'+nz[0].map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+nz.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table></div><p class="muted small">'+(nz.length-1)+' rows</p>';}
function openViewer(flat,name){const ov=document.getElementById('fvov'),b=document.getElementById('fvb');
 document.getElementById('fvn').textContent=name||flat;document.getElementById('fvraw').href=flat;
 const ext=extOf(flat);b.innerHTML='<p class="muted">Loading…</p>';ov.classList.add('open');
 if(['png','jpg','jpeg','gif','webp','svg'].includes(ext)){b.innerHTML='<img src="'+flat+'">';return;}
 if(ext==='pdf'){b.innerHTML='<iframe src="'+flat+'"></iframe>';return;}
 if(ext==='xlsx'||ext==='docx'){b.innerHTML='<div class="note">This is an Office document (.'+ext+') that can\'t be rendered inline. Use “Open in new tab”.</div>';return;}
 fetch(flat).then(r=>{if(!r.ok)throw new Error(r.status);return r.text();}).then(txt=>{
  if(ext==='md')b.innerHTML=mdToHtml(txt);else if(ext==='json'){try{b.innerHTML=jsonHi(JSON.parse(txt));}catch(e){b.innerHTML='<pre>'+esc(txt)+'</pre>';}}
  else if(ext==='csv')b.innerHTML=csvTable(txt);else b.innerHTML='<pre>'+esc(txt)+'</pre>';
 }).catch(e=>{b.innerHTML='<div class="note">Preview needs the page served over http(s) (e.g. GitHub Pages). Use “Open in new tab”.</div>';});}
function closeViewer(){document.getElementById('fvov').classList.remove('open');}
document.addEventListener('click',e=>{const a=e.target.closest('.filelink');if(a){e.preventDefault();openViewer(a.getAttribute('data-file'),a.getAttribute('data-name'));}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer();});
